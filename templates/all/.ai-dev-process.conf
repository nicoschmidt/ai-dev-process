# Project facts, read by scripts/process/ and by every session.
# Project-owned. Every repository of the project carries the same values, and
# a change to one is made in all of them.

# The repository that holds the vision, the ADRs and the iteration files.
# In a project of one repository, that repository itself.
home_repo=<owner>/<repository>

# The other repositories of the project, separated by spaces. Empty in a
# project of one repository. All of them are checked out in the project
# folder, beside the home repository.
member_repos=
